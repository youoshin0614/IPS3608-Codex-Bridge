[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ips3608-codex-bridge"
version = "0.3.0"
description = "Persistent, switch-only local bridge for the FNIRSI IPS3608 power supply"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "IPS3608 Codex Bridge contributors" }
]
keywords = ["FNIRSI", "IPS3608", "serial", "power-supply", "Codex", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
ips3608-bridge = "ips3608_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["ips3608_bridge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
